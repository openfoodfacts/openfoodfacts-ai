[project]
name = "nutrisight"
version = "0.1.0"
description = "Nutrition information extraction from food product images"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "transformers>=4.20.0",
    "datasets>=2.0.0",
    "evaluate>=0.4.0",
    "numpy>=1.20.0",
    "torch>=1.12.0",
    "Pillow>=8.0.0",
    "openfoodfacts>=2.0.0",
    "onnxruntime>=1.12.0",
    "typer>=0.9.0",
    "tqdm>=4.60.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"